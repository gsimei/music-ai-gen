# config/brands.yml
# Configuracao da marca B2B. Acessar via BRANDS_CONFIG[:b2b].
# NUNCA hardcodar precos ou limites na aplicacao — usar sempre este arquivo.
# Nomes de dominio sao placeholders; ajustar com nomes finais antes do launch.

b2b:
  hosts:
    - "jinglepro.it"
    - "jinglepro.com"
    - "b2b.lvh.me"   # dev-only: lvh.me resolve para 127.0.0.1 via DNS wildcard
  display_name: "JinglePro"
  default_locale: pt
  currency: BRL
  campaign_tier: starter
  supported_locales:
    - it
    - en
    - es
    - fr
    - de
    - pt
  primary_color: "#c1f66b"
  tiers:
    starter:
      price_cents: 7900
      lyrics_regen_limit: 20
      music_regen_limit: 2
      includes_stems: false
      includes_soundtrack: false
      max_duration_seconds: 60
    pro:
      price_cents: 14900
      lyrics_regen_limit: 3
      music_regen_limit: 2
      includes_stems: true
      includes_soundtrack: true
      max_duration_seconds: 90
