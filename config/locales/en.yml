# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"
  site_name: "Music AI Gen"
  lyrics:
    title: "Your lyrics"
    approve_button: "Approve"
    adjust_button: "I want to adjust"
    adjust_button_disabled: "Limit reached"
    feedback_placeholder: "What would you change?"
    feedback_submit: "Send and regenerate"
    lock_warning: "After approval you will not be able to make changes"
    generating: "We are rewriting your lyrics..."
    regen_remaining:
      zero: "No changes available"
      one: "1 change available"
      other: "%{count} changes available"
    approved: "Approved! We are generating the music."
    approve_failed: "Error during approval. Please try again."
    regen_failed: "Unable to regenerate. Please try again."
  errors:
    not_found: "Page not found"
    server_error: "Server error"
